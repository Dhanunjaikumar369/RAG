version: "3.9"

services:
  api:
    build:
      context: .
      target: runtime
    image: safetyrag:latest
    container_name: safetyrag_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs          # mount PDFs
      - ./vector_store:/app/vector_store  # persist FAISS index
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s           # allow time for initial indexing
